name: Deploy Website

on:
  push:
    branches: [master]
    paths: ['website/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npm run build
        working-directory: website

      - name: Sync dist to VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 178.104.118.46 >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete --rsync-path="mkdir -p /var/www/deadsox && rsync" -e "ssh -i ~/.ssh/deploy_key" website/dist/ root@178.104.118.46:/var/www/deadsox/
