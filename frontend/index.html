<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/deadsox.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#142B49" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Softball" />
    <meta name="description" content="Planungstool für Softball-Teams: Saisons, Spieltage, Lineups, Training." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700;800;900&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Softball Planner</title>
      <script>
      // Vor dem ersten Zeichnen, sonst blitzt beim Laden die helle Seite auf.
      // Pro Geraet gespeichert: abends am Handy dunkel, am Laptop hell.
      //
      // Ohne eigene Wahl entscheidet das Geraet. Wer sein Handy auf dunkel
      // gestellt hat, hat damit schon gesagt, was er will — ihn beim ersten
      // Besuch trotzdem anzublitzen waere, als hoerte man nicht zu. Die eigene
      // Wahl schlaegt das System und gilt, bis sie geaendert wird.
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'dark' && t !== 'light') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
        // Die Browserleiste am Handy traegt dieselbe Farbe wie das Band darunter.
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'dark' ? '#061A35' : '#142B49')
      } catch (e) { /* privates Fenster: dann eben hell */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
