spring.application.name=softball-lineup-planner

# H2 file-based database (persists between restarts)
spring.datasource.url=jdbc:h2:file:./data/softball
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Auth (override via environment variable APP_AUTH_PASSWORD)
app.auth.password=${APP_AUTH_PASSWORD:Deadsox123!}
