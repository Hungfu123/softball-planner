spring.application.name=softball-lineup-planner

# PostgreSQL (local Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/softball
spring.datasource.username=softball
spring.datasource.password=softball
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

server.port=8080

# Static Resources Caching (drills.pdf etc.)
spring.web.resources.cache.period=86400

# Actuator (health endpoint for readiness checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Auth (override via environment variable APP_AUTH_PASSWORD)
app.auth.password=${APP_AUTH_PASSWORD:Deadsox123!}
# Verteiltes Spieler-Passwort (WhatsApp-Gruppe) — MUSS ein anderes sein als app.auth.password (Start scheitert sonst)
app.auth.player-password=${APP_PLAYER_PASSWORD:Spieler123!}

# Wetter (Open-Meteo, gratis ohne API-Key — standardmäßig an)
feature.weather.enabled=${WEATHER_ENABLED:true}
# Fallback-Standort für Spieltage ohne Ort (Dead-Sox-Heimat)
weather.default-location=${WEATHER_DEFAULT_LOCATION:Düsseldorf}

# AI (optional — nur wenn AI_ENABLED=true)
feature.ai.enabled=${AI_ENABLED:false}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:dummy}
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.7

# WhatsApp-Polls (Node.js-Sidecar)
whatsapp.service.url=${WHATSAPP_SERVICE_URL:http://localhost:3000}
whatsapp.service.token=${WHATSAPP_SERVICE_TOKEN:devtoken}

# Antworten komprimieren.
#
# Spring Boot laesst das standardmaessig AUS. Die Listen dieser App sind JSON und damit das
# dankbarste Material, das es gibt: /api/trainings und /api/gamedays/all wiegen 16 KB und
# schrumpfen auf rund ein Zehntel. Am Schreibtisch merkt das niemand, am Handy im Stadion
# ist es der Unterschied.
#
# 1024 Byte als Schwelle: darunter kostet das Komprimieren mehr, als es spart.
server.compression.enabled=true
# Die Liste steht ausgeschrieben da, obwohl Spring Boots Vorgabe (3.4.3) bereits
# text/javascript UND application/javascript enthaelt — welchen der beiden ein Server fuer
# eine .js-Datei meldet, ist nicht festgelegt. Hinzu kommt image/svg+xml: das Logo und die
# Spielfeld-Zeichnungen sind SVG, also Text, und schrumpfen entsprechend.
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,text/javascript,application/javascript,image/svg+xml
server.compression.min-response-size=1024
