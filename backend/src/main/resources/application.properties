spring.application.name=softball-lineup-planner

# PostgreSQL (local Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/softball
spring.datasource.username=softball
spring.datasource.password=softball
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

server.port=8080

# Static Resources Caching (drills.pdf etc.)
spring.web.resources.cache.period=86400

# Actuator (health endpoint for readiness checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Auth (override via environment variable APP_AUTH_PASSWORD)
app.auth.password=${APP_AUTH_PASSWORD:Deadsox123!}

# AI (optional — nur wenn AI_ENABLED=true)
feature.ai.enabled=${AI_ENABLED:false}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:dummy}
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.7
