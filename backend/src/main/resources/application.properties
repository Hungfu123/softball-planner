spring.application.name=softball-lineup-planner

# PostgreSQL (local Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/softball
spring.datasource.username=softball
spring.datasource.password=softball
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

server.port=8080

# Auth (override via environment variable APP_AUTH_PASSWORD)
app.auth.password=${APP_AUTH_PASSWORD:Deadsox123!}
