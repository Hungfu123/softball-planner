# deadsox.duckdns.org — statische Marketing-Website (Vite Build)
#
# Läuft im softball-nginx-Container (nicht auf dem Host!). Mounts in
# /opt/softball/docker-compose.yml (Service nginx):
#   - ./repo/website/deploy/nginx-deadsox.conf:/etc/nginx/conf.d/deadsox.conf:ro
#   - /var/www/deadsox:/var/www/deadsox:ro
#
# /var/www/deadsox/ befüllt die GitHub-Action
# (.github/workflows/deploy-website.yml) per rsync.
#
# Zertifikat: certbot standalone (identisch zum App-Zertifikat). Erneuerung
# läuft automatisch über die Renewal-Hooks (pre: stop-nginx.sh, post:
# start-nginx.sh) — beide Zertifikate erneuern mit einem gemeinsamen
# `certbot renew`-Timer.

server {
    listen 80;
    server_name deadsox.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name deadsox.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/deadsox.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deadsox.duckdns.org/privkey.pem;

    root /var/www/deadsox;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json image/x-icon;
    gzip_vary on;

    # Vite-Assets sind gehasht: ein Jahr hart cachen
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA-Routing für /impressum und /datenschutz
    location / {
        try_files $uri $uri/ /index.html;
    }
}
