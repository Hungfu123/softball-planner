# deadsox.duckdns.org — statische Marketing-Website (Vite Build)
#
# Ablage auf dem VPS:  /etc/nginx/sites-available/deadsox.duckdns.org.conf
# Aktivieren:         ln -s /etc/nginx/sites-available/deadsox.duckdns.org.conf /etc/nginx/sites-enabled/
# Nginx-Check + Reload: nginx -t && systemctl reload nginx
# HTTPS danach:        certbot --nginx -d deadsox.duckdns.org
#
# Auslieferungs-Pfad /var/www/deadsox/ wird von der GitHub-Action
# (.github/workflows/deploy-website.yml) per rsync befüllt.

server {
    listen 80;
    listen [::]:80;
    server_name deadsox.duckdns.org;

    root /var/www/deadsox;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json image/x-icon;
    gzip_vary on;

    # Vite-Assets sind gehasht: ein Jahr hart cachen
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA-Routing für /impressum und /datenschutz
    location / {
        try_files $uri $uri/ /index.html;
    }
}
